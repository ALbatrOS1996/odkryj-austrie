  --red-soft: #3A1418; --ok: #5CC28C; --ok-soft: #173326; --bad: #F2867E; --bad-soft: #3A1B19; --warn: #E3B341;

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
#app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
  display: flex; flex-direction: column;
}
svg { display: block; }
button { font: inherit; color: inherit; }
a { color: var(--red); }
h1, h2, h3 { margin: 0; line-height: 1.15; }
.deco { font-family: var(--deco); font-weight: 400; letter-spacing: .2px; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.center { text-align: center; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* przyciski */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 12px 18px;
  border: 0; border-radius: 14px; background: var(--card); color: var(--ink); font-weight: 600; font-size: 16px;
  box-shadow: var(--shadow); cursor: pointer; text-decoration: none; width: 100%; transition: transform .12s ease, background .2s;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: default; transform: none; }
.btn.primary { background: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border: 1.5px solid var(--line); }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: 14px; border-radius: 12px; width: auto; }
.btn svg { width: 20px; height: 20px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.iconbtn svg { width: 24px; height: 24px; }

/* nagłówek ekranu */
.top { display: flex; align-items: center; gap: 6px; margin: -4px -8px 10px; min-height: 44px; }
.top h2 { font-size: 20px; flex: 1; }

/* karty i panele */
.panel { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 600; color: var(--ink2); }
input[type=text], textarea {
  font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); width: 100%;
}
input[type=text]:focus, textarea:focus { outline: 2px solid var(--red); border-color: transparent; }
.code-input { font-size: 30px !important; letter-spacing: 8px; text-align: center; text-transform: uppercase; font-weight: 700; }
.seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; cursor: pointer; color: var(--ink2); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch .t { font-weight: 600; }
.switch .d { font-size: 13px; color: var(--ink2); }
.tog { position: relative; width: 50px; height: 30px; flex: none; }
.tog input { opacity: 0; width: 0; height: 0; position: absolute; }
.tog span { position: absolute; inset: 0; background: var(--line); border-radius: 30px; transition: .2s; cursor: pointer; }
.tog span::after { content: ''; position: absolute; width: 24px; height: 24px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.tog input:checked + span { background: var(--red); }
.tog input:checked + span::after { transform: translateX(20px); }
.tog input:focus-visible + span { outline: 2px solid var(--ink); }

/* ekran startowy */
.hero { text-align: center; padding: 8px 0 4px; }
.hero .logo { width: 72px; height: 72px; margin: 0 auto 10px; }
.hero h1 { font-family: var(--deco); font-size: 40px; font-weight: 400; }
.hero p { margin: 6px 0 0; color: var(--ink2); }
.hero-map { margin: 14px 0 18px; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu .btn.wide { grid-column: span 2; }
.resume { border-left: 4px solid var(--red); }
.install-tip { font-size: 14px; background: var(--bg2); border-radius: 12px; padding: 12px; }

/* mapa */
.map svg { width: 100%; height: auto; }
.map path { stroke: var(--card); stroke-width: 3; stroke-linejoin: round; transition: fill .35s ease; }
.map .st.none { fill: var(--r-none); }
.map .reg-label { font-family: var(--deco); font-size: 42px; fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 7px; text-anchor: middle; pointer-events: none; }
.map.small .reg-label { display: none; }
.map .pop { animation: pop .4s ease; transform-origin: center; transform-box: fill-box; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.06); filter: brightness(1.15); } 100% { transform: scale(1); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; font-size: 13px; color: var(--ink2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* plansza */
.board { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.opp-bar { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 8px 10px; box-shadow: var(--shadow); }
.opp-bar .map { width: 96px; flex: none; }
.opp-bar .nm { font-weight: 700; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--bg2); color: var(--ink2); }
.pill svg { width: 14px; height: 14px; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.off { background: var(--bad-soft); color: var(--bad); }
.pill.turn { background: var(--red); color: #fff; }
.me-bar { background: var(--card); border-radius: 16px; padding: 10px 12px 12px; box-shadow: var(--shadow); }
.me-bar .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.counts div { text-align: center; font-size: 12px; border-radius: 10px; padding: 5px 2px; background: var(--bg2); }
.counts b { display: block; font-size: 16px; }
.stage { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 300px; }
.status-line { text-align: center; font-weight: 600; color: var(--ink2); }

/* karta regionu / specjalna */
.gcard {
  width: min(62vw, 230px); aspect-ratio: 63 / 88; margin: 0 auto; border-radius: 16px; background: var(--card);
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; border: 3px solid var(--rc, var(--red));
  animation: flip .4s ease;
}
@keyframes flip { from { transform: perspective(600px) rotateY(80deg); opacity: .3; } to { transform: none; opacity: 1; } }
.gcard .art { flex: 1.1; min-height: 0; }
.gcard .art svg { width: 100%; height: 100%; }
.gcard .mini { padding: 6px 12px 0; }
.gcard .nm { font-family: var(--deco); font-size: 26px; text-align: center; padding: 2px 8px 10px; color: var(--rc); }
.gcard.special { --rc: var(--ink); }
.gcard.special .nm { font-size: 22px; }
.gcard .desc { font-size: 13px; padding: 0 12px 12px; text-align: center; color: var(--ink2); }

/* kostka */
.die {
  width: 84px; height: 84px; margin: 0 auto; border-radius: 20px; display: grid; place-items: center;
  background: var(--card); box-shadow: var(--shadow); color: var(--dc, var(--ink)); border: 3px solid var(--dc, var(--line));
}
.die svg { width: 48px; height: 48px; }
.die.rolling { animation: roll .7s cubic-bezier(.2,.8,.3,1); }
@keyframes roll { 0% { transform: rotate(0) scale(.6); } 60% { transform: rotate(540deg) scale(1.1); } 100% { transform: rotate(720deg) scale(1); } }
.die-label { text-align: center; font-weight: 700; margin-top: 6px; color: var(--dc); }

/* kategoria */
.cat { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--cc); background: color-mix(in srgb, var(--cc) 14%, transparent); padding: 4px 10px 4px 6px; border-radius: 99px; }
.cat svg { width: 20px; height: 20px; }
.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cat-grid .btn { justify-content: flex-start; color: var(--cc); border-left: 5px solid var(--cc); }
.cat-grid .btn span { color: var(--ink); }
.cat-grid .btn svg { width: 26px; height: 26px; }
.diff { display: inline-flex; gap: 3px; vertical-align: middle; }
.diff i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.diff i.on { background: var(--ink2); }

/* pytanie */
.qbox { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.qhead { display: flex; align-items: center; gap: 8px; }
.timer { height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--red); border-radius: 8px; transition: width .25s linear; }
.timer.paused i { background: var(--warn); }
.qtext { font-size: 20px; font-weight: 650; line-height: 1.3; }
.answers { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
.ans {
  min-height: 56px; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 14px; text-align: left;
  font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .2s, border-color .2s;
}
.ans .k { width: 28px; height: 28px; flex: none; border-radius: 8px; background: var(--bg2); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--ink2); }
.ans .t { flex: 1; }
.ans .tags { display: flex; gap: 4px; }
.ans .tag { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: var(--bg2); color: var(--ink2); }
.ans.chosen { border-color: var(--ink); }
.ans.correct { border-color: var(--ok); background: var(--ok-soft); }
.ans.correct .k { background: var(--ok); color: #fff; }
.ans.wrong { border-color: var(--bad); background: var(--bad-soft); }
.ans.wrong .k { background: var(--bad); color: #fff; }
.ans.gone { opacity: .25; text-decoration: line-through; pointer-events: none; }
.ans[disabled] { cursor: default; }
.helpers { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

.result { border-radius: 14px; padding: 12px 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.result svg { width: 26px; height: 26px; flex: none; }
.result.good { background: var(--ok-soft); color: var(--ok); }
.result.bad { background: var(--bad-soft); color: var(--bad); }
.result.neutral { background: var(--bg2); color: var(--ink2); }
.expl { font-size: 15px; }
.sources { font-size: 12px; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sources a { color: var(--ink2); }

/* toasty */
#toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 10px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 50; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); max-width: 92vw; animation: tin .25s ease; }
@keyframes tin { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 40; }
.modal { background: var(--bg); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); max-height: 85vh; overflow: auto; animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }

/* poczekalnia */
.bigcode { font-size: 44px; font-weight: 800; letter-spacing: 8px; text-align: center; font-variant-numeric: tabular-nums; }
.qr { width: 190px; height: 190px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 10px; }
.qr svg, .qr img { width: 100%; height: 100%; }

/* historia / statystyki */
.bar { height: 10px; background: var(--bg2); border-radius: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cc, var(--red)); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 4px; }
.tabs button { flex: none; border: 0; background: var(--bg2); border-radius: 99px; padding: 8px 14px; font-weight: 600; cursor: pointer; color: var(--ink2); }
.tabs button.on { background: var(--ink); color: var(--bg); }

/* samouczek */
.slide { text-align: center; }
.slide h3 { font-family: var(--deco); font-size: 26px; font-weight: 400; margin: 8px 0; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--red); }

.win-banner { text-align: center; }
.win-banner h2 { font-family: var(--deco); font-size: 34px; font-weight: 400; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (min-width: 700px) { #app { padding-top: 28px; } }
</style>

  // Karty specjalne, viewBox 120x120
  const SPECIAL_ART = {

      <circle cx="48" cy="62" r="20" fill="none" stroke="var(--art-gold)" stroke-width="7"/>
      <circle cx="72" cy="62" r="20" fill="none" stroke="var(--art-gold)" stroke-width="7"/>
      <circle cx="48" cy="62" r="20" fill="none" stroke="var(--art-ink)" stroke-width="1.5"/>
      <circle cx="72" cy="62" r="20" fill="none" stroke="var(--art-ink)" stroke-width="1.5"/>
      <path d="M60 30c-4-8-16-6-14 3 1 5 14 11 14 11s13-6 14-11c2-9-10-11-14-3z" fill="var(--art-red)" stroke="var(--art-ink)" stroke-width="1.6"/>`,
    detour: `<rect width="120" height="120" fill="var(--sp-detour-bg)"/>
      <path d="M8 104 54 22l58 82z" fill="var(--art-rock)" stroke="var(--art-ink)" stroke-width="2"/>
      <path d="m44 40 10-18 14 22c-6 4-10-2-14 2s-6-2-10-6z" fill="#fff" stroke="var(--art-ink)" stroke-width="1.6"/>
      <path d="M62 52c10 6 6 16 18 20s4 18 20 22H58c-8-8 8-14-4-22s4-14 8-20z" fill="#fff" stroke="var(--art-ink)" stroke-width="1.6"/>
      <circle cx="74" cy="66" r="4" fill="#fff" stroke="var(--art-ink)"/><circle cx="90" cy="86" r="5" fill="#fff" stroke="var(--art-ink)"/>`,
    ticket: `<rect width="120" height="120" fill="var(--sp-ticket-bg)"/>
      <path d="M0 26 120 12" stroke="var(--art-ink)" stroke-width="2.5"/>

  };

    <rect y="22" width="64" height="20" fill="#fff"/><path d="M8 52 26 26l9 12 6-8 15 22z" fill="#fff" stroke="#7a0a1c" stroke-width="2.5" stroke-linejoin="round"/>

<script>
/* Odkryj Austrię! – silnik gry.
 * Czysta maszyna stanów: reduce(stan, akcja) -> stan. Bez sieci i DOM.
 * Używany przez aplikację (telefon gospodarza jest sędzią) i przez symulator (node).
 * Czas gry liczony jest "zegarem partii" (s.clock), który stoi, gdy ktoś jest offline.
 */
(function (root) {
  'use strict';
  const CATS = ['ZAB', 'GEO', 'HIS', 'KUL', 'SPO'];
  const FACES = ['ZAB', 'GEO', 'HIS', 'KUL', 'SPO', 'WYB'];
  const REGIONS = ['east', 'north', 'south', 'west'];
  const SPECIALS = ['luck', 'detour', 'ticket', 'express'];

  const DEFAULT_RULES = {
    timeLimit: 25,        // s na odpowiedź (15 / 25 / 40)
    intercepts: true,     // przechwyty
    fifty: true,          // koło ratunkowe 50/50
    specials: true,       // karty specjalne w talii
    fortress: true,       // twierdza
    timedGame: 0,         // 0 = wyłączona, 10 / 15 min
    choiceTime: 10,       // s na wybór kategorii przy ściance Wybór
    explainTime: 20,      // s na objaśnienie
    perRegion: 16,        // kart każdego regionu
    specialsPerType: 3,
    target: 2,            // ile kart każdego regionu trzeba zebrać (1 = jedna karta na region)
    reroute: true,        // Zmiana trasy
    offlineLimit: 120     // s nieobecności w trakcie pytania, potem brak odpowiedzi
  };

  // ---------- RNG z ziarnem (mulberry32) ----------
  function rand(s) {
    let t = (s.rng = (s.rng + 0x6D2B79F5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randInt(s, n) { return Math.floor(rand(s) * n); }
  function shuffle(s, arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = randInt(s, i + 1);
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------- pomocnicze ----------
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const opp = (p) => 1 - p;
  function distinct(pl, tg) { tg = tg || 1; return REGIONS.filter((r) => pl.cards[r] >= tg).length; }
  function total(pl) { return REGIONS.reduce((a, r) => a + pl.cards[r], 0); }
  function inFortress(s, p) { return s.rules.fortress && distinct(s.players[p], s.rules.target) >= 3; }
  function ev(s, e) {
    s.evSeq = (s.evSeq || 0) + 1;
    e.n = s.evSeq;
    s.log.push(e);
    if (s.log.length > 30) s.log.shift();
  }
  function hasRegionCards(s) { return s.deck.some((c) => c.t === 'r'); }

  // ---------- tworzenie partii ----------
  /**
   * opts: { seed, players:[{id,name},{id,name}], rules, starter (0|1|null),
   *         bank:[{id,cat,diff,region,correct}], seen:{qid:count}, now }
   */
  let BANK = [];
  function setBank(b) { BANK = b || []; }

  function createGame(opts) {
    if (opts.bank) setBank(opts.bank);
    const rules = Object.assign({}, DEFAULT_RULES, opts.rules || {});
    const s = {
      v: 1,
      rules,
      rng: (opts.seed >>> 0) || 1,
      players: opts.players.map((p) => ({
        id: p.id, name: p.name,
        cards: { east: 0, north: 0, south: 0, west: 0 },
        ticket: false, fiftyUsed: false
      })),
      deck: [],
      active: 0, starter: 0, turnNo: 0,
      phase: 'TURN',
      top: null, rerouted: false, extra: 0,
      face: null, q: null, answers: [null, null], fiftyRm: [[], []],
      result: null, ready: [false, false], pending: null, tradeOpts: null,
      deadline: null, clock: 0, lastNow: opts.now || 0, off: [0, 0], online: [true, true],
      winner: null, overReason: null,
      used: {}, seen: opts.seen || {},
      hist: [], log: [], evSeq: 0
    };
    const deck = [];
    REGIONS.forEach((r) => { for (let i = 0; i < rules.perRegion; i++) deck.push({ t: 'r', r }); });
    if (rules.specials) SPECIALS.forEach((k) => { for (let i = 0; i < rules.specialsPerType; i++) deck.push({ t: 's', k }); });
    shuffle(s, deck);
    s.deck = deck;
    s.starter = (opts.starter === 0 || opts.starter === 1) ? opts.starter : randInt(s, 2);
    s.active = s.starter;
    ev(s, { type: 'start', p: s.active });
    beginTurn(s);
    return s;
  }

  function beginTurn(s) {
    s.rerouted = false;
    s.turnNo++;
    reveal(s);
  }

  function reveal(s) {
    s.top = null; s.face = null; s.q = null; s.result = null; s.pending = null; s.tradeOpts = null;
    if (!hasRegionCards(s)) return endByTiebreak(s, 'deck');
    s.top = s.deck.shift();
    if (s.top.t === 's') return startSpecial(s);
    s.phase = 'TURN';
    s.deadline = null;
  }

  // ---------- karty specjalne ----------
  function specialOptions(s) {
    const a = s.active, o = opp(a);
    const A = s.players[a], O = s.players[o], tg = s.rules.target;
    switch (s.top.k) {
      case 'luck': {
        if (inFortress(s, o)) return { options: [], note: 'fortress' };
        const opts = REGIONS.filter((r) => A.cards[r] < tg && O.cards[r] > 0);
        return { options: opts, note: opts.length ? null : 'nothing' };
      }
      case 'detour': {
        const dup = REGIONS.filter((r) => A.cards[r] > tg);
        const opts = dup.length ? dup : REGIONS.filter((r) => A.cards[r] > 0);
        return { options: opts, note: opts.length ? null : 'nothing' };
      }
      case 'ticket':
        return { options: [], note: A.ticket ? 'hasTicket' : null };
      default:
        return { options: [], note: null };
    }
  }

  function startSpecial(s) {
    s.phase = 'SPECIAL';
    s.pending = specialOptions(s);
    s.deadline = s.clock + 45000; // potem wybór automatyczny
    ev(s, { type: 'special', k: s.top.k, p: s.active });
  }

  function resolveSpecial(s, region) {
    const a = s.active, o = opp(a), k = s.top.k;
    const opts = s.pending.options;
    let r = null;
    if (opts.length) r = opts.includes(region) ? region : opts[0];
    if (k === 'luck' && r) {
      s.players[o].cards[r]--; s.players[a].cards[r]++;
      ev(s, { type: 'luck', p: a, r });
    } else if (k === 'detour' && r) {
      s.players[a].cards[r]--; s.players[o].cards[r]++;
      ev(s, { type: 'detour', p: a, r });
    } else if (k === 'ticket' && !s.players[a].ticket) {
      s.players[a].ticket = true;
      ev(s, { type: 'ticketGain', p: a });
    } else if (k === 'express') {
      s.extra++;
      ev(s, { type: 'express', p: a });
    }
    // Zdobyty Bilet zostaje u gracza; pozostałe karty wracają pod spód stosu
    const kept = k === 'ticket' && s.pending.note !== 'hasTicket';
    if (!kept) s.deck.push(s.top);
    s.top = null;
    if (checkWin(s)) { s.phase = 'OVER'; s.deadline = null; return; }
    reveal(s);
  }

  // ---------- pytanie ----------
  function pickQuestion(s, cat) {
    const region = s.top ? s.top.r : null;
    let cands = BANK.filter((q) => q.cat === cat && !s.used[q.id]);
    if (!cands.length) cands = BANK.filter((q) => q.cat === cat);
    if (!cands.length) return null;
    if (cat === 'GEO' || cat === 'ZAB') {
      const reg = cands.filter((q) => q.region === region);
      if (reg.length && (cat === 'GEO' || rand(s) < 0.5)) cands = reg;
    }
    // pytania widziane rzadziej mają większą wagę
    const w = cands.map((q) => 1 / (1 + 3 * (s.seen[q.id] || 0)));
    let sum = w.reduce((a, b) => a + b, 0), x = rand(s) * sum;
    for (let i = 0; i < cands.length; i++) { x -= w[i]; if (x <= 0) return cands[i]; }
    return cands[cands.length - 1];
  }

  function startDuel(s, cat) {
    const q = pickQuestion(s, cat);
    s.used[q.id] = true;
    s.seen[q.id] = (s.seen[q.id] || 0) + 1;
    s.q = { id: q.id, cat, diff: q.diff, correct: q.correct, region: s.top.r };
    s.answers = [null, null];
    s.fiftyRm = [[], []];
    s.off = [0, 0];
    s.phase = 'DUEL';
    s.deadline = s.clock + s.rules.timeLimit * 1000;
  }

  function resolveDuel(s) {
    const a = s.active, o = opp(a), c = s.q.correct;
    const ok = s.answers.map((x) => !!x && x.o === c);
    let award = -1, kind = 'none';
    if (ok[a]) { award = a; kind = 'active'; }
    else if (ok[o] && s.rules.intercepts) { award = o; kind = 'intercept'; }
    s.result = { ok, award, kind, card: s.top.r };
    if (award >= 0) s.players[award].cards[s.top.r]++;
    s.hist.push({ q: s.q.id, cat: s.q.cat, r: s.top.r, a: s.answers.map((x) => (x ? x.o : -1)), c, act: a, award });
    ev(s, { type: 'award', kind, p: award, r: s.top.r });
    checkWin(s);
    s.phase = 'EXPLAIN';
    s.ready = [false, false];
    s.deadline = s.clock + s.rules.explainTime * 1000;
  }

  function afterExplain(s) {
    if (s.result && s.result.award === -1) s.deck.push(s.top);
    s.top = null;
    if (s.winner !== null) { s.phase = 'OVER'; s.deadline = null; return; }
    const t = tradeOptions(s);
    if (t) { s.phase = 'TRADE'; s.tradeOpts = t; s.deadline = s.clock + 30000; return; }
    endRound(s);
  }

  function tradeOptions(s) {
    const a = s.active, o = opp(a), A = s.players[a], O = s.players[o], tg = s.rules.target;
    const give = REGIONS.filter((r) => A.cards[r] >= tg + 2);
    const want = REGIONS.filter((r) => A.cards[r] < tg && O.cards[r] > tg);
    return give.length && want.length ? { give, want } : null;
  }

  function endRound(s) {
    s.tradeOpts = null;
    if (s.extra > 0) {
      s.extra--;
      ev(s, { type: 'walcRound', p: s.active });
      s.rerouted = false;
      return reveal(s);
    }
    if (s.rules.timedGame && s.clock >= s.rules.timedGame * 60000) return endByTiebreak(s, 'time');
    s.active = opp(s.active);
    beginTurn(s);
  }

  function checkWin(s) {
    if (s.winner !== null) return true;
    for (const p of [s.active, opp(s.active)]) {
      if (distinct(s.players[p], s.rules.target) === 4) {
        s.winner = p; s.overReason = 'map';
        ev(s, { type: 'win', p });
        return true;
      }
    }
    return false;
  }

  function endByTiebreak(s, reason) {
    const [A, B] = s.players;
    const da = distinct(A, s.rules.target), db = distinct(B, s.rules.target);
    let w;
    if (da !== db) w = da > db ? 0 : 1;
    else if (total(A) !== total(B)) w = total(A) > total(B) ? 0 : 1;
    else w = 'draw';
    s.winner = w; s.overReason = reason;
    s.phase = 'OVER'; s.deadline = null;
    ev(s, { type: 'win', p: w, reason });
  }

  // ---------- reduktor ----------
  // wersja mutująca (symulator) – ta sama logika co reduce
  function step(s, act) { return apply(s, act) !== false; }

  function reduce(s0, act) {
    const s = clone(s0);
    const ok = apply(s, act);
    return ok === false ? s0 : s;
  }

  function apply(s, act) {
    const p = act.p;
    if (s.phase === 'OVER' && act.type !== 'tick') return false;
    switch (act.type) {
      case 'tick': return tick(s, act);
      case 'reroute':
        if (s.phase !== 'TURN' || p !== s.active || s.rerouted || !s.rules.reroute) return false;
        if (!(s.players[p].cards[s.top.r] >= s.rules.target)) return false;
        s.deck.push(s.top); s.rerouted = true;
        ev(s, { type: 'reroute', p, r: s.top.r });
        reveal(s);
        return true;
      case 'roll': {
        if (s.phase !== 'TURN' || p !== s.active) return false;
        s.face = FACES[randInt(s, 6)];
        ev(s, { type: 'roll', p, face: s.face });
        if (s.face === 'WYB') { s.phase = 'CHOOSE'; s.deadline = s.clock + s.rules.choiceTime * 1000; }
        else startDuel(s, s.face);
        return true;
      }
      case 'choose':
        if (s.phase !== 'CHOOSE' || p !== opp(s.active) || !CATS.includes(act.cat)) return false;
        ev(s, { type: 'chosen', p, cat: act.cat });
        startDuel(s, act.cat);
        return true;
      case 'answer':
        if (s.phase !== 'DUEL' || s.answers[p] || !(act.o >= 0 && act.o <= 3)) return false;
        if (act.qid && act.qid !== s.q.id) return false;
        s.answers[p] = { o: act.o, t: s.deadline - s.clock };
        if (s.answers[0] && s.answers[1]) resolveDuel(s);
        return true;
      case 'fifty': {
        if (s.phase !== 'DUEL' || !s.rules.fifty || s.players[p].fiftyUsed || s.answers[p]) return false;
        const wrong = [0, 1, 2, 3].filter((i) => i !== s.q.correct);
        shuffle(s, wrong);
        s.fiftyRm[p] = wrong.slice(0, 2).sort();
        s.players[p].fiftyUsed = true;
        return true;
      }
      case 'ticket':
        if (s.phase !== 'EXPLAIN' || p !== s.active || !s.players[p].ticket) return false;
        if (!s.result || s.result.award !== -1 || s.winner !== null) return false;
        s.players[p].ticket = false;
        s.players[p].cards[s.top.r]++;
        s.result.award = p; s.result.kind = 'ticket';
        ev(s, { type: 'award', kind: 'ticket', p, r: s.top.r });
        s.hist[s.hist.length - 1].award = p;
        checkWin(s);
        return true;
      case 'next':
        if (s.phase !== 'EXPLAIN') return false;
        s.ready[p] = true;
        if (s.ready[0] && s.ready[1]) afterExplain(s);
        return true;
      case 'special':
        if (s.phase !== 'SPECIAL' || p !== s.active) return false;
        resolveSpecial(s, act.region);
        return true;
      case 'trade': {
        if (s.phase !== 'TRADE' || p !== s.active) return false;
        const t = s.tradeOpts;
        if (!t.give.includes(act.give) || !t.want.includes(act.want)) return false;
        const o = opp(p);
        s.players[p].cards[act.give]--; s.players[o].cards[act.give]++;
        s.players[o].cards[act.want]--; s.players[p].cards[act.want]++;
        ev(s, { type: 'trade', p, give: act.give, want: act.want });
        if (checkWin(s)) { s.phase = 'OVER'; s.deadline = null; return true; }
        endRound(s);
        return true;
      }
      case 'skipTrade':
        if (s.phase !== 'TRADE' || p !== s.active) return false;
        endRound(s);
        return true;
      case 'resign':
        if (p !== 0 && p !== 1) return false;
        s.winner = opp(p); s.overReason = 'resign';
        s.phase = 'OVER'; s.deadline = null;
        ev(s, { type: 'win', p: opp(p), reason: 'resign' });
        return true;
      default:
        return false;
    }
  }

  function tick(s, act) {
    const now = act.now;
    const dt = Math.max(0, Math.min(1500, now - (s.lastNow || now)));
    s.lastNow = now;
    if (act.online) s.online = act.online.slice();
    if (s.phase === 'OVER') return true;
    if (s.phase === 'DUEL') {
      // zegar stoi, dopóki nieobecny gracz nie odpowiedział; po limicie liczy się brak odpowiedzi
      let blocked = false;
      for (const p of [0, 1]) {
        if (!s.online[p] && !s.answers[p]) {
          s.off[p] += dt;
          if (s.off[p] >= s.rules.offlineLimit * 1000) s.answers[p] = { o: -1, t: 0 };
          else blocked = true;
        }
      }

/* Odkryj Austrię! – łączność online bez własnego serwera.
 * Minimalny klient MQTT 3.1.1 przez WebSocket do publicznych, darmowych brokerów.
 * Wszystkie wiadomości są szyfrowane AES-GCM kluczem wyprowadzonym z kodu pokoju,
 * a temat (kanał) jest skrótem kodu, więc postronni nie widzą treści.
 * Łączymy się równolegle z dwoma brokerami; duplikaty wiadomości są odrzucane.
 */
(function () {
  'use strict';
  const BROKERS = [
    'wss://broker.emqx.io:8084/mqtt',
    'wss://broker.hivemq.com:8884/mqtt'
  ];
  const enc = new TextEncoder(), dec = new TextDecoder();

  function str(s) { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; }
  function remLen(n) { const out = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; out.push(d); } while (n > 0); return out; }
  function packet(type, body) { return new Uint8Array([type, ...remLen(body.length), ...body]); }

  class MqttLink {
    constructor(url, clientId, handlers) {
      this.url = url; this.clientId = clientId; this.h = handlers;
      this.subs = new Set(); this.ok = false; this.buf = new Uint8Array(0); this.pid = 1;
      this.backoff = 1000; this.closed = false;
      this.connect();
    }
    connect() {
      if (this.closed) return;
      let ws;
      try { ws = new WebSocket(this.url, 'mqtt'); } catch (e) { return this.retry(); }
      ws.binaryType = 'arraybuffer';
      this.ws = ws;
      ws.onopen = () => {
        const body = [...str('MQTT'), 4, 0x02, 0, 30, ...str(this.clientId)];
        ws.send(packet(0x10, body));
      };
      ws.onmessage = (e) => this.onData(new Uint8Array(e.data));
      ws.onclose = () => { this.setOk(false); this.retry(); };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    }
    retry() {
      clearInterval(this.ping);
      if (this.closed) return;
      clearTimeout(this.rt);
      this.rt = setTimeout(() => this.connect(), this.backoff);
      this.backoff = Math.min(this.backoff * 2, 15000);
    }
    setOk(v) { if (this.ok !== v) { this.ok = v; this.h.onStatus && this.h.onStatus(); } }
    onData(chunk) {
      const b = new Uint8Array(this.buf.length + chunk.length); b.set(this.buf); b.set(chunk, this.buf.length);
      let i = 0;
      while (i < b.length) {

    }
    connected() { return this.links.some((l) => l.ok); }

      if (!payload.length) return;

    }
    async send(msg, retain) {
      msg.mid = msg.mid || (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, enc.encode(JSON.stringify(msg))));

      this.links.forEach((l) => { if (l.publish(topic, p, retain)) any = true; });
      return any;
    }
    clearRetained() {
      this.links.forEach((l) => l.publish(this.tHost, new Uint8Array(0), true));
    }
    close() { this.links.forEach((l) => l.close()); }
  }

  const ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ'; // bez 0/O, 1/I/L
  function newCode() {
    const r = crypto.getRandomValues(new Uint8Array(6));
    return Array.from(r, (x) => ALPHABET[x % ALPHABET.length]).join('');
  }
  function normCode(s) {
    return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1')
      .split('').filter((ch) => ALPHABET.includes(ch)).join('').slice(0, 6);
  }

  window.Net = { RoomChannel, newCode, normCode, ALPHABET, b64 };
})();

<script>
/* Odkryj Austrię! – interfejs aplikacji (PWA). */
(function () {
  'use strict';
  const E = window.Engine, C = window.COUNTRY, MAP = window.MAPA, I = window.ICONS, Net = window.Net;
  const $app = document.getElementById('app');
  const CATS = E.CATS, REGIONS = E.REGIONS;
  const CAT_NAMES = { ZAB: 'Zabytki i symbole', GEO: 'Geografia i miasta', HIS: 'Historia', KUL: 'Kultura i ludzie', SPO: 'Społeczeństwo i codzienność', WYB: 'Wybór' };
  const REG = {}; C.regions.forEach((r) => { REG[r.id] = r; });
  const SPEC = C.specialCards;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- baza pytań ----------
  function decodeBank(b64) {
    const bin = atob(b64), key = 'odkryj-austrie';
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ key.charCodeAt(i % key.length);
    return JSON.parse(new TextDecoder().decode(bytes)).map((r) => {
      let h = 0; for (const ch of r[0]) h += ch.charCodeAt(0);
      return { id: r[0], cat: r[1], diff: r[2], region: r[3], q: r[4], o: r[5], c: (r[6] - (h % 4) + 8) % 4, e: r[7], src: r[8], tags: r[9] };
    });
  }
  const BANK = decodeBank(window.BANK_DATA);
  const QB = {}; BANK.forEach((q) => { QB[q.id] = q; });
  E.setBank(BANK.map((q) => ({ id: q.id, cat: q.cat, diff: q.diff, region: q.region, correct: q.c })));

  // ---------- pamięć ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('oa.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('oa.' + k, JSON.stringify(v)); } catch (e) { /* brak miejsca lub tryb prywatny */ } },
    del(k) { try { localStorage.removeItem('oa.' + k); } catch (e) {} }
  };
  const rid = () => (crypto.getRandomValues(new Uint32Array(2)).join('').slice(0, 14));
  let profile = store.get('profile', null);
  if (!profile) { profile = { id: 'p' + rid(), name: '', vibrate: true, theme: 'auto' }; store.set('profile', profile); }
  function saveProfile() { store.set('profile', profile); applyTheme(); }
  function applyTheme() {
    if (profile.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', profile.theme);
  }
  applyTheme();

  // statystyki odpowiedzi
  function recordAnswer(qid, ok, mode) {
    const st = store.get('stats', { a: {} });
    const x = st.a[qid] || { n: 0, k: 0 };
    x.n++; if (ok) x.k++; x.l = ok ? 1 : 0; x.t = Date.now(); x.m = mode;
    st.a[qid] = x; store.set('stats', st);
  }

  // ---------- drobne narzędzia UI ----------
  let handlers = {};
  $app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-click]');
    if (!el || el.disabled) return;
    const fn = handlers[el.dataset.click];
    if (fn) { e.preventDefault(); fn(el.dataset.arg, el, e); }
  });
  function render(html, h) { handlers = h || {}; $app.innerHTML = html; }
  function toast(msg, ms) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
    box.appendChild(t); setTimeout(() => t.remove(), ms || 2600);
  }
  function vibrate(p) { try { if (profile.vibrate && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  function top(title, back) {
    return `<div class="top"><button class="iconbtn" data-click="back" aria-label="Wstecz">${I.UI.back}</button><h2>${esc(title)}</h2></div>`;
  }
  const goBack = () => { location.hash = '#/'; };
  function catChip(cat) { return `<span class="cat" style="--cc:var(--c-${cat})">${I.CAT[cat]}${cat} · ${esc(CAT_NAMES[cat])}</span>`; }
  function diffDots(d) { return `<span class="diff" aria-label="Trudność ${d} z 3">${[1, 2, 3].map((i) => `<i class="${i <= d ? 'on' : ''}"></i>`).join('')}</span>`; }
  function modal(html, h) {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.addEventListener('click', (e) => {
      if (e.target === bg) return close();
      const el = e.target.closest('[data-m]');
      if (el && h[el.dataset.m]) h[el.dataset.m](el.dataset.arg, close, bg);
    });
    return { close, el: bg };
  }

  // ---------- mapa ----------
  let mapUid = 0;
  const REGION_LABEL = (() => {
    const pts = {};
    MAP.states.forEach((s) => { (pts[s.region] = pts[s.region] || []).push([s.cx, s.cy]); });
    const out = {};
    Object.entries(pts).forEach(([r, p]) => { out[r] = [p.reduce((a, b) => a + b[0], 0) / p.length, p.reduce((a, b) => a + b[1], 0) / p.length]; });
    out.east[0] -= 40; out.north[1] -= 10;
    return out;
  })();
  /** opts: {cards, target, highlight, progress, full, small, labels, pop:[regions], title} */
  function mapSVG(o) {
    const id = 'm' + (++mapUid);
    const tg = o.target || 2;
    let defs = '';
    REGIONS.forEach((r) => {
      defs += `<pattern id="${id}${r}" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="16" height="16" fill="var(--r-${r})" opacity=".28"/><rect width="7" height="16" fill="var(--r-${r})"/></pattern>`;
    });
    const paths = MAP.states.map((s) => {
      const r = s.region;
      let fill = 'var(--r-none)', op = 1;
      if (o.full) fill = `var(--r-${r})`;
      else if (o.highlight) fill = r === o.highlight ? `var(--r-${r})` : 'var(--r-none)';
      else if (o.progress) { fill = `var(--r-${r})`; op = 0.18 + 0.82 * (o.progress[r] || 0); }
      else if (o.cards) { const n = o.cards[r] || 0; fill = n >= tg ? `var(--r-${r})` : n > 0 ? `url(#${id}${r})` : 'var(--r-none)'; }
      const pop = o.pop && o.pop.includes(r) ? ' pop' : '';
      return `<path class="st${pop}" d="${s.d}" fill="${fill}" fill-opacity="${op.toFixed(2)}"><title>${esc(s.name)} (${esc(REG[r].name)})</title></path>`;
    }).join('');
    const labels = o.labels ? REGIONS.map((r) => `<text class="reg-label" x="${REGION_LABEL[r][0]}" y="${REGION_LABEL[r][1] + 14}">${esc(REG[r].name)}</text>`).join('') : '';
    const aria = o.title || 'Mapa Austrii';
    return `<div class="map ${o.small ? 'small' : ''}"><svg viewBox="0 0 ${MAP.w} ${MAP.h}" role="img" aria-label="${esc(aria)}"><defs>${defs}</defs>${paths}${labels}</svg></div>`;
  }
  function cardsAria(cards, tg) {
    return REGIONS.map((r) => `${REG[r].name}: ${cards[r]}${cards[r] >= tg ? ' (komplet)' : ''}`).join(', ');
  }

  function regionCard(r) {
    const R = REG[r];
    return `<div class="gcard" style="--rc:var(--r-${r})" aria-label="Karta regionu ${esc(R.name)}">
      <div class="art"><svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice">${I.REGION_ART[r]}</svg></div>
      <div class="mini">${mapSVG({ highlight: r, small: true })}</div>
      <div class="nm">${esc(R.name)}</div></div>`;
  }
  function specialCard(k) {
    const S = SPEC[k];
    return `<div class="gcard special" aria-label="Karta specjalna ${esc(S.name)}">
      <div class="art"><svg viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">${I.SPECIAL_ART[k]}</svg></div>
      <div class="nm" style="padding-top:8px">${esc(S.name)}</div><div class="desc">${esc(S.flavor)}</div></div>`;
  }

  // ---------- trasy ----------
  function route() {
    const h = location.hash.replace(/^#\/?/, '');
    const [p, a] = h.split('/');
    clearInterval(timerLoop);
    if (p !== 'room' && R) { /* pokój zostaje połączony w tle, by gość nie tracił stanu */ }
    if (!profile.name && p !== 'join' && p !== 'settings') return screenWelcome(h);
    switch (p) {
      case 'new': return screenNew();
      case 'join': return screenJoin(a);
      case 'room': return enterRoom(a);
      case 'train': return screenTrain(a === 'wrong');
      case 'history': return screenHistory(a);
      case 'rules': return screenRules();
      case 'settings': return screenSettings();
      default: return screenHome();
    }
  }
  window.addEventListener('hashchange', route);

  // ---------- powitanie ----------
  function screenWelcome(next) {
    render(`<div class="hero"><div class="logo">${I.logo}</div><h1>${esc(C.gameTitle)}</h1><p>Pojedynek wiedzy o Austrii na dwa telefony</p></div>
      <div class="hero-map">${mapSVG({ full: true, labels: true })}</div>
      <div class="panel stack"><div class="field"><label for="nm">Jak masz na imię?</label>
      <input id="nm" type="text" maxlength="20" autocomplete="nickname" placeholder="np. Marcin"></div>
      <button class="btn primary" data-click="ok">Dalej</button></div>`, {
      ok: () => {
        const v = document.getElementById('nm').value.trim();
        if (!v) return toast('Wpisz imię');
        profile.name = v.slice(0, 20); saveProfile();
        route();
      }
    });
  }

  // ---------- start ----------
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; });
  function screenHome() {
    const rooms = store.get('rooms', []).slice(0, 3);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);

    if (!standalone && !tipSeen) {
      tip = ios
        ? `<div class="install-tip">Zainstaluj grę: dotknij <b>Udostępnij</b> w Safari, a potem <b>Do ekranu początkowego</b>. <button class="btn small ghost" data-click="tipx">OK</button></div>`
        : `<div class="install-tip">Grę możesz dodać do ekranu głównego jak aplikację. <div class="row" style="margin-top:8px">${deferredInstall ? '<button class="btn small primary" data-click="install">Zainstaluj</button>' : '<span class="small muted">Menu przeglądarki → Zainstaluj aplikację</span>'}<button class="btn small ghost" data-click="tipx">Ukryj</button></div></div>`;
    }
    const resume = rooms.map((r) => `<button class="btn resume" data-click="resume" data-arg="${r.code}">
      <span class="grow" style="text-align:left">Wróć do gry<br><span class="small muted">${r.opp ? 'z: ' + esc(r.opp) : 'pokój'} · ${r.code}</span></span></button>`).join('');
    render(`<div class="hero"><div class="logo">${I.logo}</div><h1>${esc(C.gameTitle)}</h1><p>Cześć, ${esc(profile.name)}! Zbierz pełną mapę Austrii.</p></div>
      <div class="hero-map">${mapSVG({ full: true, labels: true })}</div>
      <div class="stack">${tip}${resume}
      <div class="menu">
        <button class="btn primary wide" data-click="go" data-arg="new">Nowy pojedynek</button>
        <button class="btn wide" data-click="go" data-arg="join">Dołącz do pojedynku</button>
        <button class="btn" data-click="go" data-arg="train">Trening</button>
        <button class="btn" data-click="go" data-arg="history">Historia</button>
        <button class="btn" data-click="go" data-arg="rules">Zasady</button>
        <button class="btn" data-click="go" data-arg="settings">Ustawienia</button>
      </div></div>`, {
      go: (a) => { location.hash = '#/' + a; },
      resume: (code) => { location.hash = '#/room/' + code; },
      tipx: () => { store.set('tipSeen', true); screenHome(); },
      install: async () => { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; store.set('tipSeen', true); screenHome(); } }
    });
  }

  // ---------- nowy pojedynek ----------
  function screenNew() {
    const rules = Object.assign({}, E.DEFAULT_RULES, store.get('lastRules', {}));
    const sw = (k, t, d) => `<label class="switch"><span><span class="t">${t}</span><br><span class="d">${d}</span></span>
      <span class="tog"><input type="checkbox" data-r="${k}" ${rules[k] ? 'checked' : ''}><span></span></span></label>`;
    const seg = (k, vals, lab) => `<div class="seg" role="group">${vals.map((v) => `<button data-click="seg" data-arg="${k}:${v}" class="${rules[k] === v ? 'on' : ''}">${lab(v)}</button>`).join('')}</div>`;
    render(`${top('Nowy pojedynek')}
      <div class="stack">
      <div class="panel stack"><div class="field"><label for="nm">Twoje imię</label><input id="nm" type="text" maxlength="20" value="${esc(profile.name)}"></div></div>
      <div class="panel stack">
        <div class="lbl">Czas na odpowiedź</div>${seg('timeLimit', [15, 25, 40], (v) => v + ' s')}
        <div class="lbl">Ile kart każdego regionu trzeba zebrać</div>${seg('target', [1, 2], (v) => v === 1 ? '1 (krótka gra)' : '2 (zalecane)')}
        <div class="lbl">Gra na czas</div>${seg('timedGame', [0, 10, 15], (v) => v ? v + ' min' : 'wyłączona')}
      </div>
      <div class="panel">
        ${sw('intercepts', 'Przechwyty', 'Gdy gracz w turze się pomyli, a przeciwnik odpowie dobrze, kartę bierze przeciwnik.')}
        ${sw('fifty', 'Koło ratunkowe 50/50', 'Raz na partię usuwa dwie błędne odpowiedzi (tylko na twoim ekranie).')}
        ${sw('specials', 'Karty specjalne', 'Tu felix Austria, Lawina, Kolejka gondolowa i Walc.')}
        ${sw('fortress', 'Twierdza', 'Gracza z 3 skompletowanymi regionami nie można okraść kartą Szczęście.')}
        ${sw('reroute', 'Zmiana trasy', 'Raz na turę możesz pominąć kartę regionu, który już masz.')}
      </div>
      <button class="btn primary" data-click="create">Utwórz pokój</button></div>`, {
      back: goBack,
      seg: (a) => { const [k, v] = a.split(':'); rules[k] = +v; store.set('lastRules', pick(rules)); screenNewKeep(); },
      create: async () => {
        const nm = document.getElementById('nm').value.trim();
        if (nm) { profile.name = nm.slice(0, 20); saveProfile(); }
        readSwitches(rules);
        store.set('lastRules', pick(rules));
        const code = Net.newCode();
        store.set('host.' + code, { code, rules: pick(rules), me: { id: profile.id, name: profile.name }, guest: null, game: null, history: [], seen: {}, pair: { w: [0, 0], d: 0 }, lastLoser: null, created: Date.now() });
        addRoom(code, 'host', null);
        location.hash = '#/room/' + code;
      }
    });
    function screenNewKeep() { readSwitches(rules); store.set('lastRules', pick(rules)); screenNew(); }
  }
  function readSwitches(rules) { document.querySelectorAll('[data-r]').forEach((i) => { rules[i.dataset.r] = i.checked; }); }
  function pick(r) {
    const o = {}; ['timeLimit', 'target', 'timedGame', 'intercepts', 'fifty', 'specials', 'fortress', 'reroute'].forEach((k) => { o[k] = r[k]; });
    return o;
  }
  function addRoom(code, role, opp) {
    let rooms = store.get('rooms', []).filter((r) => r.code !== code);
    rooms.unshift({ code, role, opp, t: Date.now() });
    store.set('rooms', rooms.slice(0, 12));
  }

  // ---------- dołączanie ----------
  function screenJoin(code) {
    code = Net.normCode(code || '');
    render(`${top('Dołącz do pojedynku')}
      <div class="panel stack">
        <div class="field"><label for="cd">Kod pokoju (6 znaków)</label>
        <input id="cd" class="code-input" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(code)}"></div>
        <div class="field"><label for="nm">Twoje imię</label><input id="nm" type="text" maxlength="20" value="${esc(profile.name)}"></div>
        <button class="btn primary" data-click="join">Dołącz</button>
        <p class="small muted" style="margin:0">Kod pokoju dostaniesz od osoby, która utworzyła pojedynek. Możesz też po prostu otworzyć przesłany link.</p>
      </div>`, {
      back: goBack,
      join: () => {
        const c = Net.normCode(document.getElementById('cd').value);
        const nm = document.getElementById('nm').value.trim();
        if (c.length !== 6) return toast('Kod ma 6 znaków');
        if (!nm) return toast('Wpisz imię');
        profile.name = nm.slice(0, 20); saveProfile();
        if (!store.get('host.' + c)) {
          if (!store.get('guest.' + c)) store.set('guest.' + c, { code: c, joined: Date.now() });
          addRoom(c, 'guest', null);
        }
        location.hash = '#/room/' + c;
      }
    });
    const inp = document.getElementById('cd');
    inp.addEventListener('input', () => { const v = Net.normCode(inp.value); if (v !== inp.value) inp.value = v; });
  }

  // ======================================================================
  //  POKÓJ GRY (gospodarz = sędzia, gość = klient)
  // ======================================================================
  let R = null;
  let timerLoop = null;

  async function enterRoom(code) {
    code = Net.normCode(code);
    const hostData = store.get('host.' + code, null);
    const role = hostData ? 'host' : 'guest';
    if (role === 'guest' && !store.get('guest.' + code)) { store.set('guest.' + code, { code, joined: Date.now() }); addRoom(code, 'guest', null); }
    if (!R || R.code !== code) {
      closeRoom();
      R = { code, role, me: role === 'host' ? 0 : 1, seq: 0, lastEv: 0, recorded: new Set(), aids: new Set(), lastGuest: 0, lastHost: 0, viewKey: '', prevCards: null, pubKey: '', rolledAt: 0, lastRoll: 0 };
      if (role === 'host') {
        R.H = hostData;
        R.lastEv = R.H.game ? R.H.game.evSeq : 0;
      } else {
        const g = store.get('guest.' + code, {});
        R.view = g.lastView || null; R.lobby = g.lobby || null; R.pair = g.pair || null;
        R.lastEv = R.view ? R.view.evSeq : 0;
      }
      renderRoom();
      try {
        R.ch = await Net.RoomChannel.open(code, role, onRoomMsg, () => renderRoomSoft());
      } catch (e) {
        toast('Ta przeglądarka nie obsługuje szyfrowania (wymagany HTTPS).', 5000);
        return;
      }
      if (!R || R.code !== code) return;
      if (role === 'host') {
        R.loop = setInterval(hostTick, 300);
        R.hb = setInterval(() => hostPublish(true), 3000);
      } else {
        const hello = () => R && R.ch && R.ch.send({ t: 'hello', pid: profile.id, name: profile.name });
        hello(); R.hb = setInterval(hello, 3000);
        R.loop = setInterval(() => renderRoomSoft(), 1000);
      }
    }
    renderRoom();
  }
  function closeRoom() {
    if (!R) return;
    clearInterval(R.loop); clearInterval(R.hb);
    if (R.ch) R.ch.close();
    R = null;
  }

  // ---------- gospodarz ----------
  const guestOnline = () => R && Date.now() - R.lastGuest < 10000;
  function hostSave() { store.set('host.' + R.code, R.H); }
  function hostPublish(force) {
    if (!R || !R.ch) return;
    const H = R.H;
    const msg = {
      t: 'state',
      lobby: { code: R.code, host: H.me.name, guest: H.guest ? H.guest.name : null, guestId: H.guest ? H.guest.id : null, rules: H.rules },
      view: H.game ? E.view(H.game, 1) : null,
      pair: { names: [H.me.name, H.guest ? H.guest.name : ''], w: H.pair.w, d: H.pair.d, n: H.history.length }
    };
    const key = JSON.stringify(msg);
    if (!force && key === R.pubKey) return;
    R.pubKey = key;
    msg.seq = ++R.seq; msg.ts = Date.now();
    R.ch.send(msg, true);
  }
  function hostTick() {
    if (!R || R.role !== 'host') return;
    const H = R.H;
    if (H.game && H.game.phase !== 'OVER') {
      H.game = E.reduce(H.game, { type: 'tick', now: Date.now(), online: [true, guestOnline()] });
    }
    hostAfterChange(false);
  }
  function hostAfterChange(force) {
    const H = R.H;
    if (H.game && H.game.phase === 'OVER' && !H.game.recorded) {
      const g = H.game;
      g.recorded = true;
      H.history.unshift({ t: Date.now(), winner: g.winner, reason: g.overReason, starter: g.starter, turns: g.turnNo,
        score: [0, 1].map((p) => g.hist.filter((x) => x.a[p] === x.c).length), n: g.hist.length, cards: g.players.map((p) => p.cards) });
      H.history = H.history.slice(0, 50);
      if (g.winner === 'draw') H.pair.d++; else H.pair.w[g.winner]++;
      H.lastLoser = g.winner === 0 ? 1 : g.winner === 1 ? 0 : null;
      H.seen = g.seen;
    }
    const v = H.game ? E.view(H.game, 0) : null;
    const key = v ? viewKey(v) : 'lobby:' + (H.guest ? H.guest.name : '') + guestOnline();
    if (key !== R.viewKey || force) {
      hostSave();
      hostPublish(false);
      renderRoom();
    } else {
      renderRoomSoft();
    }
  }
  function hostApply(p, act) {
    const H = R.H;
    if (act.type === 'rematch') {
      if (H.game && H.game.phase !== 'OVER') return;
      hostNewGame();
    } else if (act.type === 'start') {
      if (!H.guest || (H.game && H.game.phase !== 'OVER')) return;
      hostNewGame();
    } else if (H.game) {
      H.game = E.reduce(H.game, Object.assign({}, act, { p }));
    }
    hostAfterChange(true);
  }
  function hostNewGame() {
    const H = R.H;
    H.game = E.createGame({
      seed: crypto.getRandomValues(new Uint32Array(1))[0] || 7,
      players: [{ id: H.me.id, name: H.me.name }, { id: H.guest.id, name: H.guest.name }],
      rules: H.rules, starter: H.lastLoser, seen: H.seen || {}, now: Date.now()
    });
    R.recorded = new Set();
  }

  // ---------- wiadomości ----------
  function onRoomMsg(msg) {
    if (!R) return;
    if (R.role === 'host') {
      const H = R.H;
      if (msg.t === 'hello') {
        if (!H.guest) {
          H.guest = { id: msg.pid, name: String(msg.name || 'Gość').slice(0, 20) };
          hostSave(); addRoom(R.code, 'host', H.guest.name);
          toast(`${H.guest.name} dołącza do pokoju`);
          vibrate(30);
        }
        if (H.guest.id === msg.pid) {
          const was = guestOnline();
          R.lastGuest = Date.now();
          if (msg.name && msg.name !== H.guest.name) { H.guest.name = String(msg.name).slice(0, 20); if (H.game) H.game.players[1].name = H.guest.name; hostSave(); }
          if (!was) hostAfterChange(true); else hostPublish(true);
        }
      } else if (msg.t === 'act') {
        if (!H.guest || msg.pid !== H.guest.id) return;
        R.lastGuest = Date.now();
        if (R.aids.has(msg.aid)) return;
        R.aids.add(msg.aid);
        hostApply(1, msg.act || {});
      }
    } else {
      if (msg.t !== 'state') return;
      R.lastHost = Date.now();
      if (msg.seq && R.lastSeq && msg.seq < R.lastSeq && msg.ts && R.lastTs && msg.ts < R.lastTs) return;
      R.lastSeq = msg.seq; R.lastTs = msg.ts;
      R.lobby = msg.lobby; R.pair = msg.pair;
      R.full = !!(msg.lobby && msg.lobby.guestId && msg.lobby.guestId !== profile.id);
      R.view = msg.view; R.viewAt = Date.now();
      if (msg.lobby) addRoom(R.code, 'guest', msg.lobby.host);
      store.set('guest.' + R.code, { code: R.code, lastView: msg.view, lobby: msg.lobby, pair: msg.pair, joined: Date.now() });
      const key = msg.view ? viewKey(msg.view) : 'lobby:' + JSON.stringify(msg.lobby) + R.full;
      if (key !== R.viewKey) renderRoom(); else renderRoomSoft();
    }
  }
  function myAct(act) {
    if (!R) return;
    if (R.role === 'host') return hostApply(0, act);
    const aid = rid();
    const m = { t: 'act', pid: profile.id, aid, act };
    R.ch.send(m);
    setTimeout(() => { if (R && R.ch) R.ch.send(Object.assign({}, m, { mid: undefined })); }, 1200);
  }

  function viewKey(v) {
    const c = Object.assign({}, v); delete c.clock; delete c.deadlineIn;
    return JSON.stringify(c);
  }
  function currentView() {
    if (!R) return null;
    if (R.role === 'host') { if (!R.H.game) return null; const v = E.view(R.H.game, 0); v._at = Date.now(); return v; }
    if (!R.view) return null;
    const v = R.view; v._at = R.viewAt || Date.now(); return v;
  }
  function peerOnline() { return R.role === 'host' ? guestOnline() : Date.now() - R.lastHost < 10000; }

  // ---------- rysowanie pokoju ----------
  function renderRoom() {
    if (!R || !location.hash.startsWith('#/room/')) return;
    const v = currentView();
    if (!v) return renderLobby();
    R.viewKey = viewKey(v);
    renderGame(v);
  }
  function renderRoomSoft() {
    // aktualizacje bez przebudowy ekranu: status połączenia
    if (!R || !location.hash.startsWith('#/room/')) return;
    const on = peerOnline();
    document.querySelectorAll('[data-peer]').forEach((el) => {
      el.className = 'pill ' + (on ? 'on' : 'off');
      el.innerHTML = I.UI.dot + (on ? 'online' : 'offline');
    });
    const net = document.querySelector('[data-net]');
    if (net) { const c = R.ch && R.ch.connected(); net.className = 'pill ' + (c ? 'on' : 'off'); net.innerHTML = I.UI.dot + (c ? 'połączono' : 'łączenie…'); }
    if (!currentView() && R.role === 'host') {
      const btn = document.querySelector('[data-click="start"]');
      if (btn) btn.disabled = !(R.H.guest && guestOnline());
    }
    const w = document.querySelector('[data-hostwait]');
    if (w) w.hidden = on;
  }

  function joinUrl() { return location.origin + location.pathname + '#/join/' + R.code; }

  function renderLobby() {
    const isHost = R.role === 'host';
    const netPill = `<span data-net class="pill">${I.UI.dot}łączenie…</span>`;
    if (isHost) {
      const H = R.H;
      let qrSvg = '';
      try { const q = window.qrcode(0, 'M'); q.addData(joinUrl()); q.make(); qrSvg = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) {}
      const guest = H.guest ? `<div class="row"><b class="grow">${esc(H.guest.name)}</b><span data-peer class="pill">${I.UI.dot}</span></div>` : `<div class="muted">Czekam na drugiego gracza…</div>`;
      render(`${top('Poczekalnia')}
        <div class="stack">
        <div class="panel stack center"><div class="lbl">Kod pokoju</div><div class="bigcode">${R.code}</div>
          <div class="qr">${qrSvg}</div>
          <div class="row"><button class="btn small grow" data-click="share">${I.UI.share}Udostępnij link</button><button class="btn small grow" data-click="copy">${I.UI.copy}Kopiuj</button></div>
          <div class="small muted">Wyślij link drugiej osobie albo pokaż jej kod QR.</div></div>
        <div class="panel stack"><div class="row"><div class="lbl grow">Przeciwnik</div>${netPill}</div>${guest}</div>
        <div class="panel small muted">${rulesSummary(H.rules)}</div>
        <button class="btn primary" data-click="start" ${H.guest && guestOnline() ? '' : 'disabled'}>Rozpocznij grę</button>
        </div>`, {
        back: goBack,
        share: () => shareLink(),
        copy: () => copyText(joinUrl()),
        start: () => myAct({ type: 'start' })
      });
    } else {
      const L = R.lobby;
      const body = R.full
        ? `<div class="panel stack"><b>Ten pokój jest już zajęty.</b><span class="muted">Do pojedynku dołączył inny gracz. Poproś o nowy kod.</span></div>`
        : L ? `<div class="panel stack"><div class="row"><div class="grow"><div class="lbl">Gospodarz</div><b>${esc(L.host)}</b></div><span data-peer class="pill">${I.UI.dot}</span></div>
            <div class="muted">Jesteś w pokoju ${R.code}. Czekaj, aż ${esc(L.host)} rozpocznie grę.</div></div>
            <div class="panel small muted">${rulesSummary(L.rules)}</div>`
          : `<div class="panel stack"><div class="row"><b class="grow">Łączę z pokojem ${R.code}…</b>${netPill}</div>
            <div class="small muted">Jeśli to trwa długo, sprawdź kod albo poproś gospodarza, by otworzył grę na swoim telefonie.</div></div>`;
      render(`${top('Pokój ' + R.code)}<div class="stack">${body}</div>`, { back: goBack });
    }
    renderRoomSoft();
  }
  function rulesSummary(r) {
    if (!r) return '';
    const on = (b) => b ? 'tak' : 'nie';
    return `Czas: ${r.timeLimit} s · karty na region: ${r.target} · przechwyty: ${on(r.intercepts)} · 50/50: ${on(r.fifty)} · karty specjalne: ${on(r.specials)} · twierdza: ${on(r.fortress)} · zmiana trasy: ${on(r.reroute)}${r.timedGame ? ' · gra na czas: ' + r.timedGame + ' min' : ''}`;
  }
  async function shareLink() {
    const url = joinUrl();
    const text = `Zagrajmy w „${C.gameTitle}”! Kod pokoju: ${R.code}`;
    if (navigator.share) { try { await navigator.share({ title: C.gameTitle, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText(url);
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast('Skopiowano'); }
    catch (e) { prompt('Skopiuj:', t); }
  }

  // ---------- ekran gry ----------
  const PHASE_TOTAL = (v) => ({ DUEL: v.rules.timeLimit * 1000, CHOOSE: v.rules.choiceTime * 1000, EXPLAIN: v.rules.explainTime * 1000, SPECIAL: 45000, TRADE: 30000 }[v.phase] || 0);

  function renderGame(v) {
    const me = v.me, op = 1 - me, P = v.players, tg = v.rules.target;
    const myTurn = v.active === me;
    // zdarzenia -> komunikaty
    const fresh = (v.log || []).filter((e) => e.n > R.lastEv);
    if (fresh.length) R.lastEv = Math.max(...fresh.map((e) => e.n));
    fresh.forEach((e) => eventToast(e, v));
    const rolled = fresh.find((e) => e.type === 'roll');
    // animacja nowej karty na mapie
    const pop = { 0: [], 1: [] };
    if (R.prevCards) [0, 1].forEach((p) => REGIONS.forEach((r) => { if (P[p].cards[r] > R.prevCards[p][r]) pop[p].push(r); }));
    R.prevCards = P.map((p) => Object.assign({}, p.cards));

    const oppBar = `<div class="opp-bar">${mapSVG({ cards: P[op].cards, target: tg, small: true, pop: pop[op], title: 'Mapa przeciwnika: ' + cardsAria(P[op].cards, tg) })}
      <div class="grow"><div class="nm">${esc(P[op].name)}</div>
      <div class="row wrap" style="gap:4px;margin-top:3px"><span data-peer class="pill">${I.UI.dot}</span>${!myTurn && v.phase !== 'OVER' ? '<span class="pill turn">tura przeciwnika</span>' : ''}
      ${P[op].ticket ? `<span class="pill" title="Ma kolejkę gondolową">${I.UI.gondola}bilet</span>` : ''}
      <span class="pill">${E.distinct(P[op], tg)}/4 regiony</span></div></div></div>`;
    const counts = REGIONS.map((r) => `<div style="${P[me].cards[r] >= tg ? 'background:color-mix(in srgb,var(--r-' + r + ') 22%,transparent)' : ''}"><b>${P[me].cards[r]}/${tg}</b>${esc(REG[r].name)}</div>`).join('');
    const meBar = `<div class="me-bar"><div class="head"><b class="grow">${esc(P[me].name)} (ty)</b>
      ${myTurn && v.phase !== 'OVER' ? '<span class="pill turn">twoja tura</span>' : ''}
      ${P[me].ticket ? `<span class="pill on">${I.UI.gondola}bilet</span>` : ''}
      ${v.rules.fifty ? `<span class="pill ${P[me].fiftyUsed ? '' : 'on'}">${I.UI.fifty}50/50${P[me].fiftyUsed ? ' użyte' : ''}</span>` : ''}
      <button class="iconbtn" data-click="menu" aria-label="Menu gry">${I.UI.gear}</button></div>
      ${mapSVG({ cards: P[me].cards, target: tg, pop: pop[me], title: 'Twoja mapa: ' + cardsAria(P[me].cards, tg) })}<div class="counts">${counts}</div></div>`;

    let stage = '', h = {

        stage = `<div class="qbox">

          <div class="answers">${q.o.map((o, i) => `<button class="ans ${v.myAnswer === i ? 'chosen' : ''} ${v.fiftyRm && v.fiftyRm.includes(i) ? 'gone' : ''}" data-click="ans" data-arg="${i}" ${answered ? 'disabled' : ''}>

          <div class="helpers">${canFifty ? `<button class="btn small ghost" data-click="fifty">${I.UI.fifty}50/50</button>` : '<span></span>'}

        if (!R.recorded.has(v.q.id + ':' + v.turnNo)) {

        if (res.award === me) { cls = 'good'; txt = res.kind === 'intercept' ? `Przechwyt! Zdobywasz kartę: ${rn}` : res.kind === 'ticket' ? `Kolejka gondolowa! Mimo to zdobywasz kartę: ${rn}` : `Zdobywasz kartę: ${rn}`; }

        const canTicket = myTurn && res.award === -1 && P[me].ticket && v.winner === null;

            return `<div class="ans ${c}"><span class="k">${'ABCD'[i]}</span><span class="t">${esc(o)}</span><span class="tags">${tags}</span></div>`;
          }).join('')}</div>
          ${v.myAnswer === -1 ? '<div class="small muted">Brak twojej odpowiedzi w czasie.</div>' : ''}
          <div class="panel expl">${esc(q.e)}<div class="sources" style="margin-top:8px">Źródła: ${srcs}</div></div>
          ${canTicket ? `<button class="btn" data-click="ticket">${I.UI.gondola}Użyj kolejki gondolowej i weź kartę</button>` : ''}
          <div class="row"><button class="btn small ghost" data-click="report" data-arg="${q.id}">${I.UI.flag}Zgłoś błąd</button><span class="spacer"></span>

        }
        stage = `${specialCard(k)}${myTurn && info ? `<div class="status-line small">${esc(info)}</div>` : ''}${actions}`;

      case 'TRADE': {
        const t = v.tradeOpts;
        stage = myTurn
          ? `<div class="panel stack"><b>Wymiana</b><div class="small muted">Masz co najmniej ${tg + 2} karty jednego regionu. Możesz oddać jedną z nich za region, który ${esc(P[op].name)} ma w nadmiarze.</div>
             <div class="lbl">Oddajesz</div><div class="row wrap">${t.give.map((r) => `<button class="btn small" data-give="${r}" data-click="pickGive">${esc(REG[r].name)}</button>`).join('')}</div>
             <div class="lbl">Dostajesz</div><div class="row wrap">${t.want.map((r) => `<button class="btn small" data-want="${r}" data-click="pickWant">${esc(REG[r].name)}</button>`).join('')}</div>
             <div class="row"><button class="btn ghost" data-click="tradeSkip">Pomiń</button><button class="btn primary" data-click="tradeGo">Wymień</button></div></div>`
          : `<div class="status-line">${esc(P[op].name)} może zaproponować wymianę kart…</div>`;
        break;
      }
      case 'OVER': {
        const w = v.winner;
        const hist = v.hist || [];
        const sc = [0, 1].map((p) => hist.filter((x) => x.a[p] === x.c).length);
        const reason = { map: 'pełna mapa Austrii zebrana', deck: 'w talii zabrakło kart regionów', time: 'minął czas gry', resign: 'przeciwnik się poddał' }[v.overReason] || '';
        const title = w === 'draw' ? 'Remis!' : w === me ? 'Wygrywasz!' : `Wygrywa ${esc(P[w].name)}`;
        const wrong = hist.filter((x) => x.a[me] !== x.c).length;
        stage = `<div class="win-banner"><h2>${title}</h2><div class="muted">${w === 'draw' ? esc(reason) : (w === me ? 'Brawo: ' : '') + esc(reason)}</div></div>
          ${mapSVG({ cards: w === 'draw' ? P[me].cards : P[w].cards, target: tg, labels: true })}
          <div class="panel stack"><div class="row"><span class="grow">Dobre odpowiedzi: ${esc(P[me].name)}</span><b>${sc[me]}/${hist.length}</b></div>
          <div class="row"><span class="grow">Dobre odpowiedzi: ${esc(P[op].name)}</span><b>${sc[op]}/${hist.length}</b></div>
          ${R.pair || R.H ? `<div class="row small muted"><span class="grow">Bilans pojedynków</span>${pairLine()}</div>` : ''}</div>
          <button class="btn primary" data-click="rematch">Rewanż</button>
          ${wrong ? `<button class="btn" data-click="review">Pytania do powtórki (${wrong})</button>` : ''}
          <button class="btn ghost" data-click="home">Menu główne</button>`;
        if (!R.overShown) { R.overShown = true; vibrate(w === me ? [40, 40, 120] : 60); }
        break;
      }
    }
    if (v.phase !== 'OVER') R.overShown = false;
    const hostWait = R.role === 'guest' ? `<div data-hostwait class="install-tip small" hidden>Brak połączenia z gospodarzem. Gra zatrzymana; wróci, gdy ${esc(P[0].name)} otworzy aplikację.</div>` : '';
    render(`<div class="board">${oppBar}${hostWait}<div class="stage">${stage}</div>${meBar}</div>`, h);
    if (rolled && (v.phase === 'DUEL' || v.phase === 'CHOOSE')) showDie(rolled.face);
    renderRoomSoft();
    startTimer(v);
  }
  function markChosen(i) {
    document.querySelectorAll('.ans').forEach((b, j) => { b.disabled = true; if (j === i) b.classList.add('chosen'); });
  }
  function pairLine() {
    if (R.role === 'host') { const H = R.H; return `<b>${H.pair.w[0]} : ${H.pair.w[1]}</b>${H.pair.d ? ` (remisy ${H.pair.d})` : ''}`; }
    const p = R.pair; if (!p) return '';
    return `<b>${p.w[1]} : ${p.w[0]}</b>${p.d ? ` (remisy ${p.d})` : ''}`;
  }
  function showDie(face) {
    const d = document.createElement('div');
    d.className = 'modal-bg'; d.style.alignItems = 'center'; d.style.background = 'rgba(0,0,0,.25)';
    d.innerHTML = `<div><div class="die rolling" style="--dc:var(--c-${face})">${I.CAT[face]}</div><div class="die-label" style="--dc:var(--c-${face});background:var(--card);border-radius:10px;padding:4px 10px;margin-top:10px">${esc(CAT_NAMES[face])}</div></div>`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1100);
  }
  function startTimer(v) {
    clearInterval(timerLoop);
    const total = PHASE_TOTAL(v);
    if (!total || v.deadlineIn === null || v.deadlineIn === undefined) return;
    const at = v._at, base = v.deadlineIn;
    const tick = () => {
      const el = document.querySelector('[data-timer] i');
      if (!el) return clearInterval(timerLoop);
      const live = currentView();
      const paused = live ? live.paused : v.paused;
      const left = paused ? base : Math.max(0, base - (Date.now() - at));
      el.style.width = (100 * left / total).toFixed(1) + '%';
      el.parentElement.classList.toggle('paused', !!paused);
      el.parentElement.setAttribute('aria-label', 'Pozostało ' + Math.ceil(left / 1000) + ' s');
    };
    tick(); timerLoop = setInterval(tick, 250);
  }
  function eventToast(e, v) {
    const nm = (p) => (p === v.me ? 'Ty' : v.players[p] ? v.players[p].name : '');
    const rn = (r) => REG[r] ? REG[r].name : '';
    switch (e.type) {
      case 'start': toast(e.p === v.me ? 'Zaczynasz!' : `Zaczyna ${nm(e.p)}`); break;
      case 'reroute': if (e.p !== v.me) toast(`${nm(e.p)}: zmiana trasy`); break;
      case 'luck': toast(e.p === v.me ? `Tu felix Austria: zabierasz kartę ${rn(e.r)}` : `Tu felix Austria: ${nm(e.p)} zabiera ci kartę ${rn(e.r)}`, 3500); break;
      case 'detour': toast(e.p === v.me ? `Lawina: oddajesz kartę ${rn(e.r)}` : `Lawina: dostajesz kartę ${rn(e.r)}`, 3500); break;
      case 'ticketGain': toast(e.p === v.me ? 'Masz kolejkę gondolową!' : `${nm(e.p)} ma kolejkę gondolową`); break;
      case 'express': toast('Walc: będzie dodatkowa runda!'); break;
      case 'walcRound': toast('Jeszcze jeden takt: dodatkowa runda'); break;
      case 'chosen': if (e.cat === null) toast('Czas minął: kategoria losowa'); break;
      case 'trade': toast(`Wymiana: ${rn(e.give)} za ${rn(e.want)}`, 3500); break;
    }
  }
  function gameMenu(v) {
    const m = modal(`<div class="stack"><b>Menu gry</b>
      <div class="small muted">Pokój ${R.code} · ${rulesSummary(v.rules)}</div>
      <button class="btn" data-m="rules">Zasady</button>
      ${R.role === 'host' ? '<button class="btn" data-m="share">Wyślij link ponownie</button>' : ''}
      ${v.phase !== 'OVER' ? '<button class="btn ghost" data-m="resign">Poddaj się</button>' : ''}
      <button class="btn ghost" data-m="home">Menu główne (gra zostaje zapisana)</button>

      close: (a, c) => c(),

      share: (a, c) => { c(); shareLink(); },

  function reportModal(qid) {

      <div class="row"><button class="btn ghost" data-m="close">Anuluj</button><button class="btn primary" data-m="save">Zapisz</button></div></div>`, {
      close: (a, c) => c(),
